manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sayu-hub
      url-base: https://github.com/sayu-hub
    - name: Dist16384
      url-base: https://github.com/Dist16384
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: te9no
      url-base: https://github.com/te9no

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      path: zmk
      import: app/west.yml

    - name: zmk-pmw3610-driver
      remote: Dist16384
      revision: main
      path: modules/zmk-pmw3610-driver

    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
      
    - name: zmk-input-processor-keybind
      remote: te9no
      revision: main
      path: modules/zmk-input-processor-keybind

  self:
    path: config
